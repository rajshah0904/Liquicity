[package]
name = "liquicity-security"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = { version = "4.0", features = ["tracing"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sqlx = { version = "0.6", features = ["postgres", "runtime-tokio-rustls"] }
jwt = "0.10"
bcrypt = "0.13"
rand = "0.8"
chrono = "0.4"
serde_urlencoded = "0.7"
env_logger = "0.10"
actix-session = "0.8"
actix-cors = "0.6"
rate-limit = { git = "https://github.com/actix/actix-net" }
base32 = "1.0"
qrcode = "0.11"
image = "0.24"
reqwest = { version = "0.11", features = ["json", "stream"] }
redis = { version = "0.21", features = ["tokio-native-tls"] }
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1.5"
anyhow = "1.0"
thiserror = "1.0"

[features]
default = []
postgres = ["sqlx/postgres"]
