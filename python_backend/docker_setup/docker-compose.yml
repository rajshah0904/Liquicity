version: '3.8'

services:
  # Python FastAPI Backend
  python-backend:
    build:
      context: ..
      dockerfile: docker_setup/Dockerfile
    container_name: liquicity-python-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://liquicity:password@postgres:5432/liquicity
      - REDIS_URL=redis://redis:6379
      - WALLETCONNECT_PROJECT_ID=${WALLETCONNECT_PROJECT_ID}
      - WALLETCONNECT_RELAY_URL=wss://relay.walletconnect.com
      - BRIDGE_API_KEY=${BRIDGE_API_KEY}
      - BRIDGE_API_URL=https://api.bridge.com
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    depends_on:
      - postgres
      - redis
      - walletconnect-microservice
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - liquicity-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Node.js WalletConnect Microservice
  walletconnect-microservice:
    build:
      context: ../walletconnect_microservice
      dockerfile: Dockerfile
    container_name: liquicity-walletconnect-ms
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - WALLETCONNECT_PROJECT_ID=${WALLETCONNECT_PROJECT_ID}
      - WALLETCONNECT_RELAY_URL=wss://relay.walletconnect.com
      - REDIS_URL=redis://redis:6379
      - ALLOWED_ORIGINS=http://localhost:8000,http://localhost:3000
    depends_on:
      - redis
    volumes:
      - ./walletconnect-logs:/app/logs
    networks:
      - liquicity-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: liquicity-postgres
    environment:
      - POSTGRES_DB=liquicity
      - POSTGRES_USER=liquicity
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - liquicity-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liquicity -d liquicity"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: liquicity-redis
    command: redis-server --appendonly yes --requirepass password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - liquicity-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: liquicity-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - python-backend
      - walletconnect-microservice
    networks:
      - liquicity-network
    restart: unless-stopped

  # Monitoring (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: liquicity-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - liquicity-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: liquicity-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - liquicity-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  liquicity-network:
    driver: bridge 