# CloudBuild configuration for deploying VelaFi secrets to Secret Manager
steps:
  # Create/update VelaFi API key secret
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'secrets'
      - 'versions'
      - 'add'
      - 'velafi-api-key'
      - '--data-file=secrets/velafi-api-key.txt'
      - '--project=${PROJECT_ID}'
    id: 'deploy-api-key'

  # Create/update VelaFi API secret
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'secrets'
      - 'versions'
      - 'add'
      - 'velafi-api-secret'
      - '--data-file=secrets/velafi-api-secret.txt'
      - '--project=${PROJECT_ID}'
    id: 'deploy-api-secret'

  # Create/update VelaFi webhook secret
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'secrets'
      - 'versions'
      - 'add'
      - 'velafi-webhook-secret'
      - '--data-file=secrets/velafi-webhook-secret.txt'
      - '--project=${PROJECT_ID}'
    id: 'deploy-webhook-secret'

  # Grant access to Cloud Run service account
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'secrets'
      - 'add-iam-policy-binding'
      - 'velafi-api-key'
      - '--member=serviceAccount:${_SERVICE_ACCOUNT}'
      - '--role=roles/secretmanager.secretAccessor'
      - '--project=${PROJECT_ID}'
    id: 'grant-api-key-access'

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'secrets'
      - 'add-iam-policy-binding'
      - 'velafi-api-secret'
      - '--member=serviceAccount:${_SERVICE_ACCOUNT}'
      - '--role=roles/secretmanager.secretAccessor'
      - '--project=${PROJECT_ID}'
    id: 'grant-api-secret-access'

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'secrets'
      - 'add-iam-policy-binding'
      - 'velafi-webhook-secret'
      - '--member=serviceAccount:${_SERVICE_ACCOUNT}'
      - '--role=roles/secretmanager.secretAccessor'
      - '--project=${PROJECT_ID}'
    id: 'grant-webhook-secret-access'

substitutions:
  _SERVICE_ACCOUNT: 'liquicity-backend@${PROJECT_ID}.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY